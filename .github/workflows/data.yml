name: data

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dataset-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: check python
        run: python -m py_compile import_data.py download_data.py migrations/apply_migrations.py

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/data:latest
            ghcr.io/${{ github.repository_owner }}/data:${{ github.sha }}

      - name: build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: migrations/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/data-migrate:latest
            ghcr.io/${{ github.repository_owner }}/data-migrate:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    timeout-minutes: 360
    env:
      KUBECONFIG: /etc/k3s-kubeconfig
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: deploy database
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deployment/dataset-postgres -n main --timeout=10m

      - name: run migrations
        run: |
          job="dataset-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed -e "s|MIGRATION_JOB|$job|" -e "s|MIGRATION_IMAGE|ghcr.io/${{ github.repository_owner }}/data-migrate:${{ github.sha }}|" k8s/migrate.yaml | kubectl create -f -
          if ! kubectl wait --for=condition=complete "job/$job" -n main --timeout=10m; then
            kubectl logs "job/$job" -n main || true
            exit 1
          fi
          kubectl logs "job/$job" -n main

      - name: import dataset if needed
        run: |
          job=$(kubectl get job dataset-import -n main --ignore-not-found -o name)
          if [ -n "$job" ] && [ "$(kubectl get job dataset-import -n main -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')" = "True" ]; then
            kubectl delete job dataset-import -n main --wait=true
            job=""
          fi
          if [ -z "$job" ]; then
            sed "s|DATASET_IMAGE|ghcr.io/${{ github.repository_owner }}/data:${{ github.sha }}|" k8s/import.yaml | kubectl create -f -
          fi
          if ! kubectl wait --for=condition=complete job/dataset-import -n main --timeout=5h; then
            kubectl logs job/dataset-import -n main || true
            exit 1
          fi
          kubectl logs job/dataset-import -n main

