apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dataset-postgres
  namespace: main
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataset-postgres
  namespace: main
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dataset-postgres
  template:
    metadata:
      labels:
        app: dataset-postgres
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:18-3.6
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dataset-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: dataset-postgres
  namespace: main
spec:
  selector:
    app: dataset-postgres
  ports:
    - port: 5432
      targetPort: 5432
